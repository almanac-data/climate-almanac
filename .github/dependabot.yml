# The fleet Dependabot pack, applied to the hub and propagated to every
# vertical by propagate-engine.yml (this path is in its allowlist).
#
# Two ecosystems, weekly. pip reads requirements.txt and pyproject.toml;
# minor and patch bumps arrive as one grouped PR a week, not one per package. Majors stay
# separate. github-actions bumps the pinned action majors in the workflows.
#
# Minor and patch PRs merge themselves once `test` passes:
# workflows/dependabot-automerge.yml arms auto-merge on them (and is
# propagated alongside this file). Majors wait for a human.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
