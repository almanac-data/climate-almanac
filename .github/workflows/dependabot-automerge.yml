name: dependabot-automerge

# Arms auto-merge on Dependabot's minor and patch PRs (dependabot.yml groups the
# pip ones into one PR a week), so they land by themselves once `test` passes.
# Nothing here bypasses the default branch's ruleset: the PR, the required
# check and the merge are all the ordinary ones. Majors are left alone for a
# human, because a major is where breaking changes live and CI does not
# exercise everything (link-check's headless rung, for one).
#
# Needs "Allow auto-merge" (Settings -> General) on the repository. Without it
# arming auto-merge fails, this job warns, and the PR waits as it always did.
#
# Runs on GITHUB_TOKEN: a Dependabot-triggered run gets no Actions secrets, so
# the willow-ci App can't be minted here. The one consequence is that the merge
# is a GITHUB_TOKEN push, which starts no workflows — in the template that means
# propagate-engine doesn't fire for a dependency bump. It doesn't need to:
# every vertical runs this same Dependabot pack and bumps itself, and the next
# propagation finds the files already identical.

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Read the update type
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ github.token }}
      - name: Arm auto-merge for minor and patch
        if: >-
          steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          echo "update type: ${UPDATE_TYPE:-unknown}"
          # Arm with the auto-merge mutation itself, not `gh pr merge --auto`: when a PR has
          # nothing pending (a repo with no required checks), gh quietly merges it on the
          # spot, before CI has run. The mutation only ever arms, or fails and the PR waits.
          if ! gh api graphql -f query='mutation($id:ID!){enablePullRequestAutoMerge(input:{pullRequestId:$id,mergeMethod:MERGE}){clientMutationId}}' -f id="$(gh pr view "$PR_URL" --json id -q .id)" >/dev/null; then
            echo "::warning::could not arm auto-merge on $PR_URL — check Settings >"\
                 "General > Allow auto-merge. The PR is left for a human."
          fi
      - name: Leave majors (and anything unclassified) for a human
        if: >-
          steps.meta.outputs.update-type != 'version-update:semver-minor' &&
          steps.meta.outputs.update-type != 'version-update:semver-patch'
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: echo "update type '${UPDATE_TYPE:-unknown}' — not armed; review and merge by hand"
