name: link-check

on:
  schedule:
    # Daily at 12:00 UTC — reachability sentinel for live/frozen entries.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan alerts without opening/closing issues"
        type: boolean
        default: false

# issues:        the alert step opens, updates, and closes dead-link issues.
# contents + pull-requests: the observed-refresh step pushes a branch and opens a PR.
#                It never pushes to the default branch — machine facts still land
#                through review, and `status` is never touched by any of this.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      # The PR is pushed and opened with the willow-ci App's token, not GITHUB_TOKEN:
      # GitHub starts no workflows from events made with GITHUB_TOKEN, so a PR it
      # opens or pushes to never runs CI. An App token is an ordinary actor, so
      # this PR gets test and validate like any other. (Propagation PRs use the
      # same App.) If the App's id or key isn't visible to this repo, the run
      # falls back to GITHUB_TOKEN and says so; the job never fails over it.
      - name: Mint a willow-ci token for this repo
        id: app-token
        if: vars.WILLOW_CI_APP_ID != ''
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.WILLOW_CI_APP_ID }}
          private-key: ${{ secrets.WILLOW_CI_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          # checkout keeps this token for the later `git push`; the push has to
          # come from the App too, or the PR's CI never sees the new commit.
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Detect headless mode
        id: cfg
        # Single source of truth: check_links.py reads reachability.headless too,
        # so we only need to decide here whether to install the browser.
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, yaml
          cfg = yaml.safe_load(pathlib.Path("almanac.config.yml").read_text()) or {}
          on = bool((cfg.get("reachability") or {}).get("headless", False))
          print("headless=" + ("true" if on else "false"))
          PY
      - name: Install headless browser
        if: steps.cfg.outputs.headless == 'true'
        run: |
          pip install -r requirements-headless.txt
          playwright install --with-deps chromium
      - name: Probe canonical URLs
        # check_links.py exits non-zero when an entry is unreachable; tee keeps the
        # step green so the alert step below always runs on the captured report.
        # Headless self-enables from reachability.headless in almanac.config.yml.
        run: python scripts/check_links.py --json | tee link-check-report.json
      - name: Open or refresh dead-link alerts
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/alert_on_dead_links.py \
            --report link-check-report.json \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: link-check-report
          path: link-check-report.json

      # Record what the probe saw. This is the only automated writer of `observed`,
      # and it writes facts only — `status`, `status_source`, and `status_since` are
      # never touched (SCHEMA-V2.md open item 5: the machine proposes, a human disposes).
      # Skipped on a dry run, and on schedule only for the default branch.
      - name: Refresh observed from this probe
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          python scripts/check_links.py --write-observed || true
          python scripts/build_index.py

      - name: Open or update the observed-refresh PR
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          if git diff --quiet; then
            echo "observed unchanged — nothing to propose"
            exit 0
          fi
          if [ -z "$APP_TOKEN" ]; then
            echo "::warning::willow-ci token unavailable (needs vars.WILLOW_CI_APP_ID and"\
                 "secrets.WILLOW_CI_PRIVATE_KEY visible to this repo); using GITHUB_TOKEN,"\
                 "so this PR will not run CI until someone pushes to it."
          fi
          BRANCH=monitor/observed-refresh
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add catalog catalog.json
          git commit -m "chore(monitor): refresh observed from the $(date -u +%Y-%m-%d) probe

          Written by scripts/check_links.py --write-observed. Facts only:
          checked, reachable, http_status, final_url, redirect_chain, and
          fingerprint_result where a baseline exists. status, status_source,
          and status_since are untouched — reclassification stays a human call."
          # Force-push the same branch every run so this stays one rolling PR
          # rather than a daily pile of near-identical ones.
          git push -f origin "$BRANCH"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "observed-refresh PR already open — branch updated in place"
            exit 0
          fi

          # Opening the PR needs "Allow GitHub Actions to create and approve pull
          # requests" (Settings -> Actions -> General). That is a repo/org toggle the
          # workflow's `permissions:` block cannot grant, and it is off by default.
          # When it is off we keep the branch — the probe's work is already pushed and
          # safe — and tell a human to open the PR, rather than failing a job whose
          # actual work succeeded. Enable the toggle and this becomes automatic.
          if ! gh pr create --head "$BRANCH" --base "$DEFAULT_BRANCH" \
                 --title "chore(monitor): refresh observed from the daily probe" \
                 --body "$(cat <<'BODY'
          Opened automatically by `.github/workflows/link-check.yml`.

          `scripts/check_links.py --write-observed` recorded what the daily probe actually
          saw into each entry's `observed` block, and `catalog.json` was rebuilt to match.

          **Facts only.** `status`, `status_source`, and `status_since` are untouched. A
          redirect showing up in `final_url` or `redirect_chain` may well mean an entry
          should be reclassified `redirected` / `moved` / `superseded` — that judgment is
          yours to make in a separate change, which is what SCHEMA-V2.md open item 5 is
          about.

          This branch is force-pushed on every run, so this PR reflects the most recent
          probe rather than accumulating one PR per day. Review the diff, not the history.
          BODY
          )" 2>"$RUNNER_TEMP/pr-create.err"; then
            cat "$RUNNER_TEMP/pr-create.err"
            if grep -q "not permitted to create or approve pull requests" "$RUNNER_TEMP/pr-create.err"; then
              echo "::warning::Branch $BRANCH is pushed with this probe's observed data, but"\
                   "GitHub Actions may not open PRs in this repo. Open it here:"\
                   "$GH_REPO_URL/compare/$DEFAULT_BRANCH...$BRANCH — or enable"\
                   "Settings > Actions > General > Allow GitHub Actions to create and approve"\
                   "pull requests to have this happen automatically."
              exit 0
            fi
            exit 1
          fi
