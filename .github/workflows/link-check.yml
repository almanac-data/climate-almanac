name: link-check

on:
  schedule:
    # Daily at 12:00 UTC — reachability sentinel for live/frozen entries.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Plan alerts without opening/closing issues"
        type: boolean
        default: false

# issues:        the alert step opens, updates, and closes dead-link issues.
# contents + pull-requests: the observed-refresh step pushes a branch and opens a PR.
#                It never pushes to the default branch — machine facts still land
#                through review, and `status` is never touched by any of this.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Detect headless mode
        id: cfg
        # Single source of truth: check_links.py reads reachability.headless too,
        # so we only need to decide here whether to install the browser.
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import pathlib, yaml
          cfg = yaml.safe_load(pathlib.Path("almanac.config.yml").read_text()) or {}
          on = bool((cfg.get("reachability") or {}).get("headless", False))
          print("headless=" + ("true" if on else "false"))
          PY
      - name: Install headless browser
        if: steps.cfg.outputs.headless == 'true'
        run: |
          pip install -r requirements-headless.txt
          playwright install --with-deps chromium
      - name: Probe canonical URLs
        # check_links.py exits non-zero when an entry is unreachable; tee keeps the
        # step green so the alert step below always runs on the captured report.
        # Headless self-enables from reachability.headless in almanac.config.yml.
        run: python scripts/check_links.py --json | tee link-check-report.json
      - name: Open or refresh dead-link alerts
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/alert_on_dead_links.py \
            --report link-check-report.json \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-check-report
          path: link-check-report.json

      # Record what the probe saw. This is the only automated writer of `observed`,
      # and it writes facts only — `status`, `status_source`, and `status_since` are
      # never touched (SCHEMA-V2.md open item 5: the machine proposes, a human disposes).
      # Skipped on a dry run, and on schedule only for the default branch.
      - name: Refresh observed from this probe
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          python scripts/check_links.py --write-observed || true
          python scripts/build_index.py

      - name: Open or update the observed-refresh PR
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "observed unchanged — nothing to propose"
            exit 0
          fi
          BRANCH=monitor/observed-refresh
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add catalog catalog.json
          git commit -m "chore(monitor): refresh observed from the $(date -u +%Y-%m-%d) probe

          Written by scripts/check_links.py --write-observed. Facts only:
          checked, reachable, http_status, final_url, redirect_chain, and
          fingerprint_result where a baseline exists. status, status_source,
          and status_since are untouched — reclassification stays a human call."
          # Force-push the same branch every run so this stays one rolling PR
          # rather than a daily pile of near-identical ones.
          git push -f origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --head "$BRANCH" --base "${{ github.event.repository.default_branch }}" \
              --title "chore(monitor): refresh observed from the daily probe" \
              --body "$(cat <<'BODY'
          Opened automatically by `.github/workflows/link-check.yml`.

          `scripts/check_links.py --write-observed` recorded what the daily probe actually
          saw into each entry's `observed` block, and `catalog.json` was rebuilt to match.

          **Facts only.** `status`, `status_source`, and `status_since` are untouched. A
          redirect showing up in `final_url` or `redirect_chain` may well mean an entry
          should be reclassified `redirected` / `moved` / `superseded` — that judgment is
          yours to make in a separate change, which is what SCHEMA-V2.md open item 5 is
          about.

          This branch is force-pushed on every run, so this PR reflects the most recent
          probe rather than accumulating one PR per day. Review the diff, not the history.
          BODY
          )"
          else
            echo "observed-refresh PR already open — branch updated in place"
          fi
