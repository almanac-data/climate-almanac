id: jrc-edgar
type: dataset
title: EDGAR - Emissions Database for Global Atmospheric Research
description: |
  The European Commission Joint Research Centre's independent global inventory of anthropogenic greenhouse-gas and air-pollutant emissions, built with a consistent IPCC methodology from international statistics: national totals by sector for every country and 0.1-degree gridmaps, annual from 1970 with monthly data for recent years.
