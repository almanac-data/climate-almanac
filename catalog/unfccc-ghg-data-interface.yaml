id: unfccc-ghg-data-interface
type: dataset
title: UNFCCC Greenhouse Gas Inventory Data Interface
description: |
  The UNFCCC secretariat's interface to the national greenhouse-gas inventories that Parties report under the Convention: time series, detailed data by Party, comparisons by gas and category, GHG profiles and flexible queries for Annex I and non-Annex I Parties, plus Kyoto Protocol compilation and accounting data.
publisher: United Nations Framework Convention on Climate Change (UNFCCC) secretariat
