id: nsidc-north-american-snow-cover
type: dataset
title: North American Snow Cover Extent (Rutgers Global Snow Lab)
description: |
  Weekly snow cover extent for North America (with and without Greenland) from the Rutgers Global Snow Lab's 190 km record, kept since late 1966 and archived by NOAA as the Northern Hemisphere Snow Cover Extent Climate Data Record. Complements sea-ice products for cryosphere and hydrology monitoring.
