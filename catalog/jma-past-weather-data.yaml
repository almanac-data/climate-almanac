id: jma-past-weather-data
type: dataset
title: Japan Meteorological Agency Past Weather Data (過去の気象データ検索)
description: |
  The Japan Meteorological Agency's archive of station observations across Japan: hourly, daily, ten-day, monthly and annual values of temperature, precipitation, wind, sunshine, snow and more for its observing stations, with climatological normals, searchable by station and date and downloadable as CSV.
